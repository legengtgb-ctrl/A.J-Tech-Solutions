<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reset password | AJ Tech</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="auth">
      <section class="hero">
        <div class="brand">
          <img class="company-logo" src="/img/logo2.png" alt="AJ Tech Solutions" />
        </div>
        <h1>We’ll help you get back in.</h1>
        <p>
          Enter your account email and we’ll send a secure, time-limited reset
          link.
        </p>
        <div class="orb"></div>
      </section>
      <section class="form-side">
        <form class="card" id="forgot">
          <h2>Forgot password?</h2>
          <p class="sub">
            We’ll email reset instructions if the address is registered.
          </p>
          <div class="field">
            <label>Email address</label
            ><input class="input" type="email" name="email" required />
          </div>
          <div class="message"></div>
          <button class="btn">Send reset link</button>
          <p class="sub" style="text-align: center; margin-top: 20px">
            <a href="login.html">Back to sign in</a>
          </p>
        </form>
      </section>
    </main>
    <script src="js/app.js"></script>
    <script>
      forgot.onsubmit = async (e) => {
        e.preventDefault();
        try {
          let d = await api("/api/auth/forgot-password", {
            method: "POST",
            body: JSON.stringify(formData(forgot)),
          });
          forgot.querySelector(".message").className = "message success";
          forgot.querySelector(".message").textContent = d.message;
        } catch (x) {
          forgot.querySelector(".message").textContent = x.message;
        }
      };
    </script>
  </body>
</html>
