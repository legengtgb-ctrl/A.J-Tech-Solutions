<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign in | AJ Tech Solutions</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <main class="auth">
      <section class="hero">
        <div class="brand">
          <img class="company-logo" src="/img/logo2.png" alt="AJ Tech Solutions" />
        </div>
        <h1>Technology that moves you forward.</h1>
        <p>
          Securely access your personalized technology services hub, requests,
          and support.
        </p>
      </section>
      <section class="form-side">
        <form class="card" id="login">
          <button type="button" class="toggle" data-theme style="float: right">
            ◐
          </button>
          <h2>Welcome back</h2>
          <p class="sub">Sign in to your account.</p>
          <div class="field">
            <label>Username or email</label
            ><input
              class="input"
              name="identity"
              autocomplete="username"
              required
            />
          </div>
          <div class="field">
            <label>Password</label>
            <div class="password">
              <input
                class="input"
                id="password"
                type="password"
                name="password"
                autocomplete="current-password"
                required
              /><button type="button" data-toggle="#password">
                <i class="fa fa-eye"></i>
              </button>
            </div>
          </div>
          <div class="row">
            <label class="check"
              ><input type="checkbox" name="rememberMe" /> Remember me</label
            ><a href="forgot-password.html">Forgot password?</a>
          </div>
          <div class="message"></div>
          <button class="btn">Sign in <i class="fa fa-arrow-right"></i></button>
          <p class="sub" style="text-align: center; margin-top: 20px">
            New to AJ Tech? <a href="register.html">Create an account</a>
          </p>
        </form>
      </section>
    </main>
    <script src="js/app.js"></script>
    <script>
      login.onsubmit = async (e) => {
        e.preventDefault();
        let b = login.querySelector(".btn"),
          m = login.querySelector(".message");
        b.disabled = true;
        b.textContent = "Signing in…";
        try {
          let d = await api("/api/auth/login", {
            method: "POST",
            body: JSON.stringify(formData(login)),
          });
          location = d.redirect;
        } catch (x) {
          m.textContent = x.message;
          b.disabled = false;
          b.textContent = "Sign in →";
        }
      };
    </script>
  </body>
</html>
