<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Set new password | AJ Tech</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <section class="form-side" style="min-height: 100vh">
      <form class="card" id="reset">
        <h2>Set a new password</h2>
        <p class="sub">Choose a strong, unique password.</p>
        <div class="field">
          <label>New password</label
          ><input class="input" type="password" name="password" required />
        </div>
        <div class="field">
          <label>Confirm new password</label
          ><input
            class="input"
            type="password"
            name="confirmPassword"
            required
          />
        </div>
        <div class="message"></div>
        <button class="btn">Update password</button>
      </form>
    </section>
    <script src="js/app.js"></script>
    <script>
      reset.onsubmit = async (e) => {
        e.preventDefault();
        try {
          let v = formData(reset);
          v.token = new URLSearchParams(location.search).get("token");
          let d = await api("/api/auth/reset-password", {
            method: "POST",
            body: JSON.stringify(v),
          });
          toast(d.message, true);
          setTimeout(() => (location = "login.html"), 1200);
        } catch (x) {
          reset.querySelector(".message").textContent = x.message;
        }
      };
    </script>
  </body>
</html>
